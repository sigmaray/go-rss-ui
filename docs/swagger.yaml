basePath: /api/v1
definitions:
  api.ErrorResponse:
    properties:
      error:
        example: resource not found
        type: string
    type: object
  api.FeedResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        example: 1
        type: integer
      last_error:
        type: string
      last_error_at:
        type: string
      last_successfully_fetched_at:
        type: string
      title:
        example: Example Feed
        type: string
      updated_at:
        type: string
      url:
        example: https://example.com/feed.xml
        type: string
    type: object
  api.FeedSummary:
    properties:
      id:
        example: 1
        type: integer
      title:
        example: Example Feed
        type: string
      url:
        example: https://example.com/feed.xml
        type: string
    type: object
  api.FetchFeedResponse:
    properties:
      items_created:
        example: 5
        type: integer
      items_updated:
        example: 2
        type: integer
    type: object
  api.ItemResponse:
    properties:
      author:
        type: string
      content:
        type: string
      created_at:
        type: string
      description:
        type: string
      feed:
        $ref: '#/definitions/api.FeedSummary'
      feed_id:
        example: 1
        type: integer
      guid:
        type: string
      id:
        example: 1
        type: integer
      link:
        example: https://example.com/article
        type: string
      published_at:
        type: string
      title:
        example: Article title
        type: string
      updated_at:
        type: string
    type: object
  api.LoginRequest:
    properties:
      password:
        example: password
        type: string
      username:
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  api.MessageResponse:
    properties:
      message:
        example: logged out
        type: string
    type: object
  api.PaginatedFeedsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.FeedResponse'
        type: array
      page:
        example: 1
        type: integer
      total:
        example: 1
        type: integer
      total_pages:
        example: 1
        type: integer
    type: object
  api.PaginatedItemsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.ItemResponse'
        type: array
      page:
        example: 1
        type: integer
      total:
        example: 1
        type: integer
      total_pages:
        example: 1
        type: integer
    type: object
  api.PaginatedUsersResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.UserResponse'
        type: array
      page:
        example: 1
        type: integer
      total:
        example: 1
        type: integer
      total_pages:
        example: 1
        type: integer
    type: object
  api.UserResponse:
    properties:
      created_at:
        type: string
      id:
        example: 1
        type: integer
      updated_at:
        type: string
      username:
        example: admin
        type: string
    type: object
  validation.FeedInput:
    properties:
      url:
        type: string
    required:
    - url
    type: object
  validation.UserInput:
    properties:
      password:
        description: Password string `validate:"required,password_strength,min=8,max=128"
          json:"password"`
        maxLength: 128
        minLength: 8
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  validation.UserInputUpdate:
    properties:
      password:
        description: Password string `validate:"omitempty,password_strength,min=8,max=128"
          json:"password"`
        maxLength: 128
        minLength: 8
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - username
    type: object
host: localhost:8082
info:
  contact: {}
  description: REST API for RSS feed management application
  title: Go RSS UI API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and create session cookie
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/api.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      description: Clear session cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.MessageResponse'
      summary: Logout
      tags:
      - auth
  /feeds:
    get:
      description: Returns paginated list of RSS feeds
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PaginatedFeedsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - CookieAuth: []
      summary: List feeds
      tags:
      - feeds
    post:
      consumes:
      - application/json
      description: Add a new RSS feed URL
      parameters:
      - description: Feed data
        in: body
        name: feed
        required: true
        schema:
          $ref: '#/definitions/validation.FeedInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.FeedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Create feed
      tags:
      - feeds
  /feeds/{id}:
    delete:
      description: Permanently delete a feed and its items
      parameters:
      - description: Feed ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Delete feed
      tags:
      - feeds
    get:
      description: Returns a single feed by ID
      parameters:
      - description: Feed ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.FeedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Get feed
      tags:
      - feeds
    put:
      consumes:
      - application/json
      description: Update feed URL
      parameters:
      - description: Feed ID
        in: path
        name: id
        required: true
        type: integer
      - description: Feed data
        in: body
        name: feed
        required: true
        schema:
          $ref: '#/definitions/validation.FeedInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.FeedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Update feed
      tags:
      - feeds
  /feeds/{id}/fetch:
    post:
      description: Fetch and process a single RSS feed
      parameters:
      - description: Feed ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.FetchFeedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Fetch feed
      tags:
      - feeds
  /items:
    get:
      description: Returns paginated list of RSS items
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - description: Filter by feed ID
        in: query
        name: feed_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PaginatedItemsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - CookieAuth: []
      summary: List items
      tags:
      - items
  /items/{id}:
    get:
      description: Returns a single RSS item by ID
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Get item
      tags:
      - items
  /users:
    get:
      description: Returns paginated list of users
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PaginatedUsersResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - CookieAuth: []
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Create a new user
      parameters:
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/validation.UserInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Create user
      tags:
      - users
  /users/{id}:
    delete:
      description: Permanently delete a user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Delete user
      tags:
      - users
    get:
      description: Returns a single user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Get user
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Update an existing user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/validation.UserInputUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Update user
      tags:
      - users
securityDefinitions:
  CookieAuth:
    in: cookie
    name: mysession
    type: apiKey
swagger: "2.0"
