# Production compose for a VPS with shared infra (postgres + redis).
# Infra: /home/foobar/r/sandbox/infra/postgres and .../infra/redis on network "infra".
# Set GO_RSS_UI_DB_* and GO_RSS_UI_REDIS_* in .env (hosts: postgresql, redis).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-rss-ui-app
    environment:
      GO_RSS_UI_DB_HOST: ${GO_RSS_UI_DB_HOST:-postgresql}
      GO_RSS_UI_DB_USER: ${GO_RSS_UI_DB_USER:-postgres}
      GO_RSS_UI_DB_PASSWORD: ${GO_RSS_UI_DB_PASSWORD:?GO_RSS_UI_DB_PASSWORD is required}
      GO_RSS_UI_DB_NAME: ${GO_RSS_UI_DB_NAME:-go_rss_ui}
      GO_RSS_UI_DB_PORT: ${GO_RSS_UI_DB_PORT:-5432}
      GO_RSS_UI_DB_SSLMODE: ${GO_RSS_UI_DB_SSLMODE:-disable}
      GO_RSS_UI_DB_TIMEZONE: ${GO_RSS_UI_DB_TIMEZONE:-UTC}
      GO_RSS_UI_REDIS_HOST: ${GO_RSS_UI_REDIS_HOST:-redis}
      GO_RSS_UI_REDIS_PORT: ${GO_RSS_UI_REDIS_PORT:-6379}
      GO_RSS_UI_REDIS_PASSWORD: ${GO_RSS_UI_REDIS_PASSWORD:?GO_RSS_UI_REDIS_PASSWORD is required}
      GO_RSS_UI_BACKGROUND_FETCH_ENABLED: ${GO_RSS_UI_BACKGROUND_FETCH_ENABLED:-true}
      GO_RSS_UI_BACKGROUND_FETCH_INTERVAL: ${GO_RSS_UI_BACKGROUND_FETCH_INTERVAL:-60}
      GO_RSS_UI_SESSION_SECRET: ${GO_RSS_UI_SESSION_SECRET:?GO_RSS_UI_SESSION_SECRET is required}
      GO_RSS_UI_PORT: ${GO_RSS_UI_PORT:-8082}
      GO_RSS_UI_ENV: ${GO_RSS_UI_ENV:-production}
      GO_RSS_UI_SESSION_SECURE: ${GO_RSS_UI_SESSION_SECURE:-0}
      GIN_MODE: release
    ports:
      - "${GO_RSS_UI_PORT:-8082}:${GO_RSS_UI_PORT:-8082}"
    networks:
      - infra
    restart: unless-stopped

networks:
  infra:
    external: true
    name: infra
